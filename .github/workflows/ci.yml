name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyaaf2 and OpenTimelineIO (independent readers used by the AAF and OTIO tests)
        run: python -m pip install pyaaf2==1.7.1 opentimelineio==0.18.1 otio-aaf-adapter==2.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux system packages (WebKitGTK, ALSA, ffmpeg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev ffmpeg patchelf xvfb
      - name: UI — install, typecheck, test, build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Release scripts
        run: node --test scripts/release-config.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
        env:
          VCSD_AAF_PYTHON: python
      - name: Plugin editor windows (X11, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --release -p vcsd-plugins --test editor
