[workspace]
resolver = "2"
members = ["crates/vcsd-core", "crates/vcsd-plugins", "crates/vcsd-engine", "crates/vcsd-cli", "crates/vcsd-app", "crates/vcsd-testplug"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
sha2 = "0.11"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
