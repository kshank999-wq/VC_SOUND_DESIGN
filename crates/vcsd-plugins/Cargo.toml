[package]
name = "vcsd-plugins"
description = "VC Sound Design plugin hosting: VST3 (all platforms) and Audio Units (macOS) — scanning, instances, state and parameters."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
vst3 = "0.3.0"
libloading = "0.9.1"

[dev-dependencies]
vcsd-testplug = { path = "../vcsd-testplug" }

[target.'cfg(target_os = "macos")'.dependencies]
# relax-void-encoding: AudioUnit handles are passed as `*mut c_void`
objc2 = { version = "0.6", features = ["relax-void-encoding"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11 = { version = "2.21", features = ["xlib"] }
